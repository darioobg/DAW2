<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Actividad 12 - Estilos para imágenes</title>
        <link rel="stylesheet" href="css/reset.css">
        <link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <div class="container-fluid">
            
            <div class="row no-gutters">
                <div class="col-4 columna">
                    <img src="https://picsum.photos/200/200" alt="Imagen 1">
                </div>
            </div>

            <div class="row no-gutters">
                <div class="col-4 columna">
                    <img src="https://picsum.photos/800/800" class="img-fluid" alt="Imagen 2">
                </div>
            </div>

            <div class="row no-gutters">
                <div class="col-4 columna clearfix">
                    <img src="https://picsum.photos/200/200" class="img-fluid float-left" alt="Imagen 3 Izq">
                    <img src="https://picsum.photos/200/200" class="img-fluid float-right" alt="Imagen 3 Der">
                </div>
            </div>

            <div class="row no-gutters">
                <div class="col-4 columna clearfix">
                    <img src="https://picsum.photos/200/200" class="img-fluid float-left rounded" alt="Imagen 4 Redondeada">
                    <img src="https://picsum.photos/200/200" class="img-fluid float-right img-thumbnail" alt="Imagen 4 Marco">
                </div>
            </div>

            <div class="row no-gutters">
                <div class="col-6 columna">
                    <figure class="figure">
                        <img src="https://picsum.photos/400/400" class="figure-img img-fluid rounded" alt="Figura 5">
                        <figcaption class="figure-caption text-center">Lorem ipsum, dolor sit amet consectetur adipisicing elit.</figcaption>
                    </figure>
                </div>
            </div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.min.js"></script>
    </body>
</html>
